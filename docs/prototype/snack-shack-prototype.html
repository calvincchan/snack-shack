<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Snack Shack clickable prototype (September 2026). Mock data only; nothing is saved.
     Reference for flows and wording. Do not reuse this code structure. See docs/HANDOFF.md. -->
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Snack Shack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E8ECE5; --ink:#17212A; --muted:#5A6670; --line:#D9DFD6;
  --accent:#F2A900; --accent-soft:#FFF1C7; --accent-ink:#3A2900;
  --treat:#D1443B; --treat-bg:#FCE4E1; --snack:#2D8A55; --snack-bg:#DDF1E4;
  --warn:#A8681A; --warn-bg:#FCEFD6; --bad:#C2352C; --bad-bg:#FBE1DE; --ok:#2D8A55; --ok-bg:#DDF1E4;
  --shadow:0 1px 2px rgba(23,33,42,.06),0 4px 14px rgba(23,33,42,.06);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161B; --surface:#19222A; --sunk:#0C1216; --ink:#E7ECE8; --muted:#94A2AA; --line:#2A363F;
    --accent:#F5B82E; --accent-soft:#3A2E10; --accent-ink:#241900;
    --treat:#F0766C; --treat-bg:#3B1F1D; --snack:#5CC98A; --snack-bg:#15301F;
    --warn:#E6AE55; --warn-bg:#382A12; --bad:#F0766C; --bad-bg:#3B1F1D; --ok:#5CC98A; --ok-bg:#15301F;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161B; --surface:#19222A; --sunk:#0C1216; --ink:#E7ECE8; --muted:#94A2AA; --line:#2A363F;
  --accent:#F5B82E; --accent-soft:#3A2E10; --accent-ink:#241900;
  --treat:#F0766C; --treat-bg:#3B1F1D; --snack:#5CC98A; --snack-bg:#15301F;
  --warn:#E6AE55; --warn-bg:#382A12; --bad:#F0766C; --bad-bg:#3B1F1D; --ok:#5CC98A; --ok-bg:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,input,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
small{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.top h1{font-size:19px;font-weight:800;line-height:1.1}
.top .tsub{font-size:12px;color:var(--muted)}
.demo{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:4px 8px;border-radius:999px}

.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.row-flex{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps div{font-size:12px;font-weight:600;color:var(--muted);padding:8px 6px 0;border-top:4px solid var(--line)}
.steps div.on{color:var(--ink);border-color:var(--accent)}
.steps div.done{color:var(--ink);border-color:var(--snack)}

.group-h{display:flex;align-items:baseline;gap:8px;margin:4px 2px -4px}
.group-h h3{font-size:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0}
.item.flag{background:var(--bad-bg)}
.main{display:flex;align-items:center;gap:10px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;line-height:1.25}
.nm small{font-size:12.5px}
.sub{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.sub b{color:var(--ink)}

.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.t{background:var(--treat)} .dot.n{background:var(--snack)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.tag.t{background:var(--treat-bg);color:var(--treat)} .tag.n{background:var(--snack-bg);color:var(--snack)}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);flex:none}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:600;line-height:1}
.stepper button:active{background:var(--line)}
.stepper input{width:52px;height:44px;border:0;border-inline:1px solid var(--line);text-align:center;font-size:18px;font-weight:700;background:var(--surface)}
input.mini{width:48px;height:32px;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--surface);font-weight:600}

.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted);font-weight:600}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.dock{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;z-index:5}
.dock .k{font-size:12px;color:var(--muted)} .dock .v{font-family:var(--display);font-size:20px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.kv .total{font-family:var(--display);font-size:20px;font-weight:700}
.hr{height:1px;background:var(--line);grid-column:1/-1}

.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.note.bad{background:var(--bad-bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Sell */
.basket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:6;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.basket .big{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.meters{display:flex;gap:8px;flex-wrap:wrap}
.meter{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
:root[data-theme="dark"] .meter{background:rgba(0,0,0,.12)}
.meter.full{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.chip{border:0;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:inherit}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile.t{box-shadow:inset 0 0 0 2px var(--treat-bg)}
.tile .p{font-family:var(--display);font-size:24px;font-weight:800}
.tile b{font-weight:600;line-height:1.2}
.tile .dot{position:absolute;top:12px;right:12px}
.tile:disabled{opacity:.35}
.tile:not(:disabled):active{transform:scale(.98)}
.paid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.paid button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.paid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Buy */
.line{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:12px;cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}

/* Shop */
.check{width:24px;height:24px;accent-color:var(--snack);flex:none}
.item.got{opacity:.5}
.item.got b{text-decoration:line-through}

/* Insights */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.kpi small{display:block;font-size:12px}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .val{fill:var(--ink);font-weight:700}
.chart rect.bar{fill:var(--accent)}
.chart line{stroke:var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 6px}
td{padding:9px 6px;border-top:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;padding-left:0}
.bar-in{height:6px;border-radius:3px;background:var(--sunk);margin-top:4px;overflow:hidden}
.bar-in i{display:block;height:100%;background:var(--snack)}
.bar-in i.t{background:var(--treat)}
.insight{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.insight:first-of-type{border-top:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0;min-height:54px}
.tabs .ic{width:48px;height:28px;border-radius:999px;display:grid;place-items:center}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ic{background:var(--accent-soft)}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:transform .08s,opacity .15s}}

/* v4 additions */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-height:52px}
.opt b{font-family:var(--display);font-size:17px;font-weight:700}
.opt small{font-size:12px}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt .rec{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--snack)}
.opt.loss small{color:var(--bad)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.toggle button[aria-pressed="true"].t{background:var(--treat-bg);border-color:var(--treat);color:var(--treat)}
.toggle button[aria-pressed="true"].n{background:var(--snack-bg);border-color:var(--snack);color:var(--snack)}
.toggle button[aria-pressed="true"].z{background:var(--accent-soft);border-color:var(--accent)}
.slot{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:2px}
.slot:last-child{padding-bottom:2px}
.gauge{height:8px;border-radius:4px;background:var(--sunk);position:relative}
.gauge i{display:block;height:100%;border-radius:4px}
.gauge i.ok{background:var(--ok)} .gauge i.warn{background:var(--warn)} .gauge i.bad{background:var(--bad)}
.gauge .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.strike{text-decoration:line-through;color:var(--muted);font-weight:500}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;color:inherit;resize:vertical}
.clr{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.bullets{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.item.open{background:var(--bg)}
.rowbtn{all:unset;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;cursor:pointer}
.cbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.cbox.on{background:var(--snack);border-color:var(--snack)}
.cbox.on::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.rowbtn .nm .pill{margin-top:4px}
.tag.z{background:var(--sunk);color:var(--muted);white-space:nowrap}
.email{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.email-h{background:var(--sunk);padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.email-h span{display:inline-block;width:62px;color:var(--muted);font-size:12px}
.email-b{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.email-b p{margin:0}
.attach{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;align-self:flex-start}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#3A2900" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 10h-13z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <div><h1>Snack Shack</h1><div class="tsub" id="topsub"></div></div>
  <span class="demo">Mock data</span>
</div></header>

<main class="wrap"><div id="view"></div></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const money=n=>(n<-0.004?'−':'')+'$'+Math.abs(n).toFixed(2);
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const shortDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const FLOAT=30, MAX_ITEMS=3, MAX_TREATS=1, TARGET_DAYS=2, ME='Calvin';
const VOLUNTEERS=['Calvin','Yuki','Priya','Dan','Marco'];

/* ---------- Items (stock counted in pieces) ---------- */
const mk=o=>Object.assign({bundle:1,status:'active'},o);
const P=[
 mk({id:'pop',name:'Popcorn, lightly salted',price:1,treat:false,cost:.45,loc:'Shelf'}),
 mk({id:'chips',name:'Chips, assorted',price:1,treat:false,cost:.52,loc:'Shelf'}),
 mk({id:'pretz',name:'Pretzel twists',price:1,treat:false,cost:.38,loc:'Shelf'}),
 mk({id:'crack',name:'Cheddar crackers',price:1,treat:false,cost:.41,loc:'Shelf'}),
 mk({id:'veg',name:'Veggie straws',price:1,treat:false,cost:.48,loc:'Shelf'}),
 mk({id:'seaweed',name:'Seaweed snack',price:2,treat:false,cost:.85,loc:'Shelf'}),
 mk({id:'fruitcup',name:'Mandarin fruit cups',price:1,treat:false,cost:.82,loc:'Shelf',isNew:true}),
 mk({id:'gran',name:'Granola bar',price:1,treat:true,cost:.35,loc:'Shelf'}),
 mk({id:'gum',name:'Fruit gummies',price:1,treat:true,cost:.30,loc:'Shelf'}),
 mk({id:'mini',name:'Nestlé mini bars, assorted',price:1,bundle:2,treat:true,cost:17.99/130,loc:'Shelf',isNew:true}),
 mk({id:'choc',name:'Chocolate bar',price:2,treat:true,cost:.95,loc:'Shelf'}),
 mk({id:'popsicle',name:'Fruit popsicle',price:1,treat:true,cost:.33,loc:'Freezer'}),
 mk({id:'ice',name:'Ice-cream bar',price:2,treat:true,cost:1.05,loc:'Freezer'}),
 mk({id:'rice',name:'Rice crackers',price:null,treat:false,cost:14.99/50,loc:'Shelf',status:'needs-price',isNew:true}),
];
const byId=Object.fromEntries(P.map(p=>[p.id,p]));
const active=()=>P.filter(p=>p.status==='active');
const STOCK={pop:26,chips:12,pretz:22,crack:9,veg:30,seaweed:18,fruitcup:24,gran:14,gum:6,mini:130,choc:15,popsicle:30,ice:8,rice:50};
P.forEach(p=>p.stock=STOCK[p.id]);
/* During a sale, prices are the ones locked in at "Start sale". */
const locked=p=>S&&!S.done&&S.prices&&S.prices[p.id];
const eff=p=>locked(p)||{price:p.price,bundle:p.bundle};
const treatOf=p=>{const l=locked(p);return l?l.treat:p.treat};
const frz=p=>p.loc==='Freezer'?' <span class="tag z">❄ Freezer</span>':'';
const priceLabel=(price,bundle)=>price==null?'No price':bundle>1?`${bundle} for $${price}`:`$${price}`;
const perPiece=p=>{const e=eff(p);return e.price/e.bundle};

/* margin bands */
const band=m=>m>=.6?['ok','Great deal']:m>=.45?['ok','Good']:m>=.3?['warn','Fair']:m>=0?['warn','Low margin']:['bad','At a loss'];
const bandPill=(m,small)=>{const [c,l]=band(m);return `<span class="pill ${c}" ${small?'style="font-size:11.5px;padding:2px 8px"':''}>${l}</span>`};
function optNote(o,cost){
  if(o.margin>=0)return `${Math.round(o.margin*100)}% margin`;
  return `Loses ${money(cost*o.bundle-o.price)} each`;
}

/* price options and suggestion */
function priceOptions(cost){
  const o=[[1,1],[2,1],[1,2],[1,3]].map(([price,bundle])=>({price,bundle,margin:1-cost*bundle/price}));
  const within=(x,lo,hi)=>x.margin>=lo&&x.margin<=hi;
  let rec=o.filter(x=>x.price===1&&within(x,.45,.75)).sort((a,b)=>b.margin-a.margin)[0]
       ||o.filter(x=>x.price===2&&x.bundle===1&&within(x,.45,.85))[0]
       ||o.slice().sort((a,b)=>b.margin-a.margin)[0];
  o.forEach(x=>x.rec=x===rec);
  return o;
}

function isSlow(p){const r=rateOf(p.id);if(r==null)return false;const same=active().filter(q=>q.treat===p.treat).map(q=>rateOf(q.id)).filter(x=>x!=null);return r<same.reduce((a,b)=>a+b,0)/same.length*.6}

function lineupReason(p){
  const n=lastOffered(p.id);
  if(p.isNew)return 'New';

  if(isSlow(p))return 'Slow seller';
  if(n>=2&&n<99)return `Not out for ${n} sales`;
  if(n===99)return 'Not sold yet';
  return '';
}
function suggestLineup(){
  const score=p=>(p.isNew?40:0)+(recentOut(p.id)?30:0)+(isSlow(p)?35:0)+Math.min(lastOffered(p.id),5)*10;

  return [...pick(p=>!p.treat,3),...pick(p=>p.treat,2)];
}

/* needs brief */
const SLOTS=[
 {k:'snack',name:'Snacks',sub:'chips, popcorn, crackers',f:p=>!p.treat},
 {k:'treat',name:'Treats',sub:'candy, bars, popsicles, ice cream',f:p=>p.treat},
];
function briefData(){
  const recent=history.slice(-3);
  return SLOTS.map(s=>{
    const its=active().filter(s.f);
    const onHand=its.reduce((a,p)=>a+Math.floor(p.stock/p.bundle),0);
    const avg=recent.reduce((a,h)=>a+its.reduce((b,p)=>b+(h.sold[p.id]||0)/p.bundle,0),0)/recent.length;
    const days=avg?onHand/avg:99, need=Math.max(0,Math.ceil(TARGET_DAYS*avg-onHand));
    const cls=days<1?'bad':days<TARGET_DAYS?'warn':'ok';
    const label=days<1?'Runs out next sale':days<TARGET_DAYS?'About 1 sale day left':'Covered for 2+ sale days';
    return {...s,its,onHand,avg,days,need,cls,label};
  });
}

/* deal check */
let deal={shelf:'17.99',pcs:'130',gst:true,treat:true};
function typeRate(treat){
  const r=[];history.forEach(h=>h.lineup.forEach(id=>{if(byId[id].treat===treat)r.push(h.sold[id]||0)}));
  return r.length?r.reduce((a,b)=>a+b,0)/r.length:15;
}
function dealCalc(){
  const shelf=+deal.shelf,pcs=Math.floor(+deal.pcs);
  if(!(shelf>0&&pcs>0))return null;
  const total=shelf*(deal.gst?1.05:1),uc=total/pcs,opts=priceOptions(uc),rec=opts.find(o=>o.rec);
  const deals=Math.floor(pcs/rec.bundle),sales=deals*rec.price,profit=sales-total;
  const same=active().filter(p=>p.treat===deal.treat&&!p.isNew);
  const avgCost=same.reduce((a,p)=>a+p.cost,0)/same.length;
  const rate=typeRate(deal.treat),days=deals/rate;
  return {total,uc,opts,rec,deals,sales,profit,avgCost,rate,days,pcs};
}
function dealOutHTML(){
  const c=dealCalc();
  if(!c)return `<small>Enter the shelf price and how many pieces are in the box.</small>`;
  const [cls]=band(c.rec.margin),kind=deal.treat?'treats':'snacks';
  return `
    <div class="row-flex" style="flex-wrap:wrap"><span class="pill ${cls}" style="font-size:15px;padding:6px 12px">${band(c.rec.margin)[1]}</span>
      <span class="muted">at <b style="color:var(--ink)">${priceLabel(c.rec.price,c.rec.bundle)}</b> · ${optNote(c.rec,c.uc)}</span></div>
    <dl class="kv" style="font-size:14px">
      <dt>Cost each${deal.gst?' (with GST)':''}</dt><dd class="num">${money(c.uc)} <small>(${(c.uc*100).toFixed(1)}¢)</small></dd>
      <dt>${c.rec.bundle>1?`${c.deals} deals at ${priceLabel(c.rec.price,c.rec.bundle)}`:`${c.deals} sold at ${priceLabel(c.rec.price,1)}`}</dt><dd class="num">${money(c.sales)}</dd>
      <dt>${c.profit>=0?'Profit on the box':'Loss on the box'}</dt><dd class="num" style="color:var(--${c.profit>=0?'ok':'bad'})">${money(c.profit)}</dd>
    </dl>
    <ul class="bullets" style="font-size:13.5px">

      <li>Similar ${kind} sell about ${Math.round(c.rate)} a sale day when they're out, so this lasts about <b>${Math.max(1,Math.round(c.days))} sale day${Math.round(c.days)>1?'s':''}</b> in the lineup.${c.days>6?' That\'s a big box; make sure it fits in storage.':''}</li>

}

  return `<div class="eyebrow" style="margin-top:4px">Price</div>
    <div class="opts">${o.map(x=>optBtn(p,x,p.price===x.price&&p.bundle===x.bundle)).join('')}</div>
    <div class="eyebrow" style="margin-top:4px">Type${lk&&lk.treat!==p.treat?` <span style="text-transform:none;letter-spacing:0;font-weight:600">(today still a ${lk.treat?'treat':'snack'})</span>`:''}</div>
    <div class="toggle"><button class="n" data-et="${p.id}:treat:0" aria-pressed="${!p.treat}">Snack</button><button class="t" data-et="${p.id}:treat:1" aria-pressed="${p.treat}">Treat (sugary)</button></div>
    <div class="eyebrow" style="margin-top:4px">Storage</div>
    <div class="toggle"><button class="z" data-et="${p.id}:loc:Shelf" aria-pressed="${p.loc==='Shelf'}">Shelf</button><button class="z" data-et="${p.id}:loc:Freezer" aria-pressed="${p.loc==='Freezer'}">❄ Freezer</button></div>
    <div class="field"><label for="ed-name-${p.id}">Name kids see</label><input id="ed-name-${p.id}" data-ename="${p.id}" value="${p.name.replace(/"/g,'&quot;')}"></div>`;
}

/* ===== Insights ===== */
function renderInsights(){
  const H=history;
  const rev=s=>Object.values(s.rev).reduce((a,b)=>a+b,0);
  const cogs=s=>Object.entries(s.sold).reduce((a,[id,n])=>a+n*byId[id].cost,0);
  const tRev=H.reduce((a,s)=>a+rev(s),0),tCost=H.reduce((a,s)=>a+cogs(s),0),profit=tRev-tCost;
  const netVar=H.reduce((a,s)=>a+(s.counted-s.expected),0);
  const ids=[...new Set(H.flatMap(s=>s.lineup))];
  const days=Object.fromEntries(ids.map(id=>[id,H.filter(s=>s.lineup.includes(id)).length]));
  const units=Object.fromEntries(ids.map(id=>[id,H.reduce((a,s)=>a+(s.sold[id]||0),0)]));
  const revBy=Object.fromEntries(ids.map(id=>[id,H.reduce((a,s)=>a+(s.rev[id]||0),0)]));
  const allUnits=Object.values(units).reduce((a,b)=>a+b,0);
  const treatUnits=ids.filter(id=>byId[id].treat).reduce((a,id)=>a+units[id],0);
  const credits=H.reduce((a,s)=>a+s.credits,0);
  const adj=H.flatMap(s=>s.adj).filter(a=>a.qty>0),adjCost=adj.reduce((a,x)=>a+x.qty*byId[x.id].cost,0);
  const rows=ids.map(id=>({p:byId[id],d:days[id],per:units[id]/days[id],r:revBy[id]})).sort((a,b)=>b.per-a.per);
  const maxPer=rows[0].per;
  const W=320,Ht=170,pad=24,bw=36,revs=H.map(rev),mx=Math.ceil(Math.max(...revs)/50)*50;
  const gap=(W-pad*2-bw*H.length)/(H.length-1);
  const y=v=>Ht-28-(v/mx)*(Ht-54);
  const bars=H.map((s,i)=>{const x=pad+i*(bw+gap),yy=y(revs[i]);return `<rect class="bar" x="${x}" y="${yy}" width="${bw}" height="${Ht-28-yy}" rx="4"/><text class="val" x="${x+bw/2}" y="${yy-6}" text-anchor="middle">$${Math.round(revs[i])}</text><text x="${x+bw/2}" y="${Ht-10}" text-anchor="middle">${shortDate(s.date)}</text>`}).join('');
  const popDays=H.filter(s=>s.lineup.includes('popsicle'));
  const outs={};H.forEach(s=>s.outs.forEach(id=>outs[id]=(outs[id]||0)+1));
  const slow=rows[rows.length-1];
  const tips=[
    popDays.length>1?`<b>Popsicles are fading.</b> ${popDays[0].sold.popsicle} sold on ${shortDate(popDays[0].date)}, ${popDays[popDays.length-1].sold.popsicle} on ${shortDate(popDays[popDays.length-1].date)}. Leave them out of the lineup on cold days.`:'',
    ...Object.entries(outs).map(([id,n])=>`<b>${byId[id].name} sold out ${n} of the ${days[id]} days it was out.</b> Bring more of it, or buy more next trip.`),
    `<b>${slow.p.name} is the slowest mover</b>, about ${Math.round(slow.per)} per sale day it's out. Try a lower price on the Prices tab, or leave it out of the lineup for a while.`,
    `<b>${Math.round(treatUnits/allUnits*100)}% of items sold are treats.</b> The one-treat rule is holding; most kids add a snack to their treat.`,
    adj.length?`<b>${adj.reduce((a,x)=>a+x.qty,0)} items were missing or damaged before sales</b> (${money(adjCost)} at cost). Found during the box check, so they didn't throw off the cash.`:'',
  ].filter(Boolean);
  const notes=H.filter(s=>s.note).slice().reverse();
  $('#view').innerHTML=`
  <div><div class="eyebrow">This term · ${H.length} sale days</div></div>
  <div class="kpis">
    <div class="kpi"><small>Sales</small><div class="v num">${money(tRev)}</div><small>${money(tRev/H.length)} per sale</small></div>
    <div class="kpi"><small>Profit after stock cost</small><div class="v num">${money(profit-credits)}</div><small>${Math.round((profit-credits)/tRev*100)}% margin, after ${money(credits)} helper credits</small></div>
    <div class="kpi"><small>Items sold</small><div class="v num">${allUnits}</div><small>${Math.round(allUnits/H.length)} per sale</small></div>
    <div class="kpi"><small>Cash over/short, net</small><div class="v num">${money(netVar)}</div><small>${(n=>n+(n===1?' sale':' sales'))(H.filter(s=>Math.abs(s.counted-s.expected)>3).length)} over ±$3</small></div>
  </div>
  <div class="card"><div class="eyebrow" style="margin-bottom:6px">Sales by sale day</div>
    <svg class="chart" viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Sales by sale day bar chart">
      <line x1="${pad-8}" x2="${W-pad+8}" y1="${Ht-28}" y2="${Ht-28}"/>${bars}</svg></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">What the numbers say</div>${tips.map(t=>`<div class="insight"><span>${t}</span></div>`).join('')}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Count-up notes</div>${notes.map(s=>`<div class="insight"><span><b>${shortDate(s.date)}</b> · ${s.note}</span></div>`).join('')}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:2px">Items by sales per day out</div><small>Only counts days the item was in the lineup, so items out less often compare fairly.</small><div class="tbl-wrap" style="margin-top:6px"><table>
    <thead><tr><th>Item</th><th>Days out</th><th>Per day</th><th>Sales</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td>${x.p.name}<div class="bar-in"><i class="${x.p.treat?'t':''}" style="width:${x.per/maxPer*100}%"></i></div></td><td>${x.d}</td><td>${Math.round(x.per)}</td><td>${money(x.r)}</td></tr>`).join('')}</tbody></table></div>
    <small>Items not in a lineup yet (like the new mini bars) appear after their first sale.</small></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Cash check-in history</div>
    ${H.slice().reverse().map(s=>{const v=+(s.counted-s.expected).toFixed(2);return `<div class="insight" style="align-items:center"><div class="spacer"><b>${fmtDate(s.date)}</b><br><small>${s.vols} · ${s.lineup.length} items out · counted ${money(s.counted)}</small></div><span class="pill ${varClass(v)}">${varLabel(v)}</span></div>`}).join('')}</div>`;
}


/* ---------- Events ---------- */
let toastT;
function copy(txt,msg){const fail=()=>toast('Copy is blocked here. Try again from a browser.');try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fail)}catch(_){fail()}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
const clampInt=v=>Math.max(0,parseInt(v,10)||0);

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.seg){buySeg=d.seg;renderBuy();return}
  if(d.step){const [f,k,dv]=d.step.split(':');
    if(f==='credits'){S.credits=Math.max(0,S.credits+ +dv);$('#credits-x').value=S.credits}
    else if(f==='check'){S.check[k]=Math.max(0,S.check[k]+ +dv)}
    else{const obj=f==='close'?S.close:S.cash;obj[k]=Math.max(0,obj[k]+ +dv);$(`#${f}-${k}`).value=obj[k]}
    refreshCount();return}
  if(d.add){basket.push(d.add);paidWith=null;renderSell();return}
  if(d.rm){basket.splice(+d.rm,1);paidWith=null;renderSell();return}
  if(d.paid){paidWith=+d.paid;renderSell();return}
  if(d.rml){draft.lines.splice(+d.rml,1);renderBuy();return}
  if(d.lt){const [i,k,v]=d.lt.split(':');draft.lines[+i][k]=k==='treat'?v==='1':v;renderBuy();return}
  if(d.lp){const [i,pr,bu]=d.lp.split(':');const l=draft.lines[+i];if(pr==='later'){l.later=true;l.price=null;l.bundle=null}else{l.later=false;l.price=+pr;l.bundle=+bu}refreshLine(+i);return}
  if(d.lu){const i=S.lineup.indexOf(d.lu);i<0?S.lineup.push(d.lu):S.lineup.splice(i,1);renderCount();return}
  if(d.rs){const [id,r]=d.rs.split(':');S.reason[id]=r;refreshCount();return}
  if(d.et){const [id,k,v]=d.et.split(':');const p=byId[id];
    if(k==='treat'){const nt=v==='1';if(p.treat!==nt){p.treat=nt;const lk=locked(p);toast(lk&&lk.treat!==nt?`${p.name} becomes a ${nt?'treat':'snack'} from the next sale day`:`${p.name} is now a ${nt?'treat':'snack'}`)}}
    else{p.loc=v;toast(v==='Freezer'?`${p.name} marked as a freezer item`:`${p.name} marked as a shelf item`)}
    renderPrices();return}
  if(d.open){openItem=openItem===d.open?null:d.open;renderPrices();return}
  if(d.dt){const [k,v]=d.dt.split(':');deal[k]=k==='treat'?v==='1':!deal[k];renderBuy();return}
  if(d.payall){purchases.filter(pu=>pu.buyer===d.payall&&pu.status!=='paid').forEach(pu=>{pu.status='paid';pu.ref='E-transfer, Sep 28'});renderBuy();toast(`${d.payall}'s claims marked paid by the treasurer`);return}
  if(d.setprice){const [id,pr,bu]=d.setprice.split(':');const p=byId[id];
    if(p.status==='needs-price'){p.price=+pr;p.bundle=+bu;p.status='active';toast(`${p.name} priced at ${priceLabel(+pr,+bu)}. It can go in a lineup now`)}
    else{p.price=+pr;p.bundle=+bu;const lk=locked(p);toast(lk&&(lk.price!==p.price||lk.bundle!==p.bundle)?`${p.name} will be ${priceLabel(+pr,+bu)} from the next sale day. Today stays ${priceLabel(lk.price,lk.bundle)}`:`${p.name} now ${priceLabel(+pr,+bu)}`)}
    render();return}
  const a=d.act;
  if(a==='phase'){S.phase=d.to;if(d.to==='count')S.step=0;renderCount();window.scrollTo(0,0)}
  else if(a==='lu-reset'){S.lineup=suggestLineup();renderCount()}
  else if(a==='ck-match'){S.check[d.id]=byId[d.id].stock;refreshCount()}
  else if(a==='start-sale'){S.adj=[];S.lineup.forEach(id=>{const p=byId[id],got=S.check[id]??p.stock,diff=p.stock-got;if(diff!==0){S.adj.push({id,qty:diff,reason:diff>0?(S.reason[id]||'Missing'):'Found'});p.stock=got}});S.items=[...S.lineup];S.items.forEach(id=>S.prices[id]={price:byId[id].price,bundle:byId[id].bundle,treat:byId[id].treat});S.items.forEach(id=>{S.close[id]=byId[id].stock;S.waste[id]=0});S.phase='selling';renderTabs();renderCount();window.scrollTo(0,0);toast(S.adj.length?'Differences reported. Sale started':'Sale started')}
  else if(a==='step'){S.step=+d.to;renderCount();window.scrollTo(0,0)}
  else if(a==='sample-counts'){const s={pop:14,chips:0,pretz:15,crack:1,veg:21,seaweed:9,fruitcup:12,gran:5,gum:0,mini:106,choc:7,popsicle:19,ice:1,rice:41};S.items.forEach(id=>S.close[id]=Math.min(byId[id].stock,s[id]??byId[id].stock));S.waste.popsicle=1;S.credits=1;renderCount();toast('Sample leftover counts filled in')}
  else if(a==='sample-cash'){const c=calc();let t=Math.round(c.expected)-1;const pick={'10':1};t-=10;pick['5']=Math.floor(t*.2/5);t-=pick['5']*5;pick['2']=Math.floor(t*.6/2);t-=pick['2']*2;pick['1']=t-1;pick['25c']=4;DENOMS.forEach(x=>S.cash[x.k]=pick[x.k]||0);renderCount();toast('Sample cash count filled in')}
  else if(a==='close'){const c=calc();if(!canClose(c))return;
    history.push({date:S.date,vols:S.vols,lineup:[...S.items],adj:S.adj,sold:Object.fromEntries(S.items.map(id=>[id,Math.max(0,c.rows[id].sold)])),rev:Object.fromEntries(S.items.map(id=>[id,c.rows[id].rev])),credits:S.credits,waste:{...S.waste},expected:c.expected,counted:c.counted,outs:S.items.filter(id=>S.close[id]===0),note:S.note.trim()});
    S.items.forEach(id=>{byId[id].stock=S.close[id];byId[id].isNew=false});S.result=c;S.done=true;render();window.scrollTo(0,0)}
  else if(a==='next-session'){const dt=new Date(S.date+'T12:00:00');dt.setDate(dt.getDate()+2);newSession(dt.toISOString().slice(0,10),'Priya, Dan');render()}
  else if(a==='clear'){basket=[];paidWith=null;renderSell()}
  else if(a==='claim'){trip={by:ME,when:'This week'};renderBuy();toast("Trip claimed. Others will see you're going")}
  else if(a==='release'){trip={by:null};renderBuy()}
  else if(a==='addline'){draft.lines.push(newLine());renderBuy()}
  else if(a==='deal-log'){const c=dealCalc();if(!c)return;draft.lines=[Object.assign(newLine(),{sel:'new',treat:deal.treat,pcs:String(c.pcs),cost:c.total.toFixed(2),price:c.rec.price,bundle:c.rec.bundle})];buySeg='log';renderBuy();window.scrollTo(0,0);toast('Numbers carried over. Add a name and the receipt photo')}
  else if(a==='savebuy'){
    const lines=draft.lines.filter(l=>l.sel);
    for(const l of lines){
      if(!(+l.pcs>0&&+l.cost>0))return toast('Enter pieces and cost for every line');
      if(l.sel==='new'&&(!l.name.trim()||l.treat===null))return toast('Give each new item a name and pick Snack or Treat');
      if(l.price==null&&!l.later)return toast('Pick a price for each line, or Decide later');
    }
    if(!lines.length)return toast('Add at least one item');
    if(!draft.receipt)return toast('Attach the receipt photo to claim a reimbursement');
    const saved=lines.map(l=>{let p;
      if(l.sel==='new'){const id='n'+Date.now()+Math.random().toString(36).slice(2,5);p=mk({id,name:l.name.trim(),treat:l.treat,loc:l.loc,price:l.later?null:l.price,bundle:l.bundle||1,status:l.later?'needs-price':'active',cost:0,isNew:true,stock:0});P.push(p);byId[id]=p}
      else{p=byId[l.sel];p.price=l.price;p.bundle=l.bundle}
      p.stock+=+l.pcs;p.cost=+l.cost/+l.pcs;
      return {id:p.id,pcs:+l.pcs,cost:+l.cost}});
    const pu={no:nextNo++,date:draft.date,store:draft.store,buyer:draft.buyer,status:'submitted',receipt:draft.receipt,lines:saved};
    purchases.unshift(pu);newDraft();buySeg='claims';render();
    toast(`Claim ${claimId(pu)} sent to the treasurer. Stock updated`);}
  else if(a==='copyclaims'){const open=purchases.filter(pu=>pu.status!=='paid');const by={};open.forEach(pu=>(by[pu.buyer]=by[pu.buyer]||[]).push(pu));
    copy('Snack Shack reimbursements\n\n'+Object.entries(by).map(([n,l])=>`${n}: ${money(l.reduce((a,pu)=>a+ptotal(pu),0))}\n`+l.map(pu=>`  ${claimId(pu)} ${pu.store} ${pu.date} ${money(ptotal(pu))} (${STATUS[pu.status][1]})`).join('\n')).join('\n\n'),'Claim summary copied')}
  else if(a==='copycsv'){const rows=[['claim','date','store','bought_by','status','item','pieces','line_cost','cost_per_piece']];
    purchases.forEach(pu=>pu.lines.forEach(l=>rows.push([claimId(pu),pu.date,pu.store,pu.buyer,pu.status,byId[l.id].name,l.pcs,l.cost.toFixed(2),(l.cost/l.pcs).toFixed(3)])));
    copy(rows.map(r=>r.map(v=>/[,"]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n'),'CSV copied. Paste it into a spreadsheet')}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.f&&d.f.startsWith('check:')){S.check[d.f.slice(6)]=clampInt(t.value);$('#ck-sum').textContent=checkSummary();return}
  if(d.f){const [f,k]=d.f.split(':');if(f==='credits')S.credits=clampInt(t.value);else (f==='close'?S.close:f==='waste'?S.waste:S.cash)[k]=clampInt(t.value);refreshCount()}
  else if(d.ini){S.ini[+d.ini]=t.value;refreshCount()}
  else if(d.note!==undefined){S.note=t.value}
  else if(d.l){const [i,k]=d.l.split(':');const l=draft.lines[+i];l[k]=t.value;if(k==='sel'){pickLineDefaults(l);renderBuy()}else if(k==='pcs'||k==='cost')refreshLine(+i)}
  else if(d.d){draft[d.d]=t.value}
  else if(d.deal){deal[d.deal]=t.value;$('#deal-out').innerHTML=dealOutHTML()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.dataset.f.startsWith('check:'))refreshCount();
  if(t.dataset.ename){const p=byId[t.dataset.ename],v=t.value.trim();if(v&&v!==p.name){p.name=v;toast('Name updated');renderPrices()}}
  if(t.id==='b-receipt'&&t.files[0]){draft.receipt=t.files[0].name;$('#b-rname').textContent=t.files[0].name}
});
render();
</script>
